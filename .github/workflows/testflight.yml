# .github/workflows/testflight.yml
# Baut NOOP (ryanbr/noop) bei jedem neuen Release und lädt es zu TestFlight hoch.
# Prüfung läuft täglich auf Linux (billig), der Mac-Runner startet nur bei neuem Release.

name: NOOP -> TestFlight

on:
  schedule:
    - cron: "17 3 * * *"        # täglich 03:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Aktuellen Release erneut bauen"
        type: boolean
        default: false

permissions:
  contents: write    # Merker-Tag "built/<release>" setzen
  actions: write     # Workflow aktiv halten (GitHub deaktiviert Zeitpläne nach 60 Tagen Ruhe)

env:
  UPSTREAM: ryanbr/noop
  TEAM_ID: Z4AK89R29U
  BUNDLE_PREFIX: tv.gerdon           # ergibt tv.gerdon.noop
  REFRESH_DAYS: 75                   # spätestens nach so vielen Tagen neu bauen (TestFlight-Builds laufen 90 Tage)

concurrency:
  group: noop-testflight
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      build: ${{ steps.tag.outputs.build }}
    steps:
      - name: Workflow aktiv halten
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/testflight.yml/enable" || true

      - name: Neuesten Release ermitteln
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          TAG="$(git ls-remote --tags --refs "https://github.com/$UPSTREAM.git" \
                 | sed 's|.*refs/tags/||' | grep -E '^v?[0-9]' | sort -V | tail -1)"
          if [ -z "$TAG" ]; then echo "Kein Release-Tag gefunden"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          # Letzter Build-Zeitpunkt aus den Merkern "built-at/JJJJMMTTHHMM"
          LAST_AT="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/built-at/" --jq '.[].ref' 2>/dev/null \
                     | sed 's|.*/||' | sort -n | tail -1)"
          LIMIT="$(date -u -d "${REFRESH_DAYS} days ago" +%Y%m%d%H%M)"
          echo "Letzter Build: ${LAST_AT:-unbekannt}, Auffrischung fällig vor: $LIMIT"
          if [ "$FORCE" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Erzwungen: $TAG"
          elif ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/built/$TAG" >/dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Neuer Release: $TAG"
          elif [ -z "$LAST_AT" ] || [ "$LAST_AT" -lt "$LIMIT" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; echo "Auffrischung: letzter Build älter als $REFRESH_DAYS Tage"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"; echo "$TAG schon gebaut, Build noch frisch. Nichts zu tun."
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TAG: ${{ needs.check.outputs.tag }}
    steps:
      - name: Neuestes stabiles Xcode wählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Quellcode des Releases holen
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.check.outputs.tag }}
          path: src

      - name: Werkzeuge
        run: brew install xcodegen

      - name: Zertifikat und API-Schlüssel einrichten
        env:
          P12_BASE64: ${{ secrets.DEV_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEV_CERT_PASSWORD }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PW="$(uuidgen)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dev.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/dev.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/dev.p12"
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Bundle-ID, Projekt, Build-Nummer
        working-directory: src
        run: |
          CFG="Config/BundleIdSecrets.xcconfig"
          cp Config/BundleIdSecrets.example.xcconfig "$CFG"
          if grep -q '^[[:space:]]*BUNDLE_ID_PREFIX' "$CFG"; then
            sed -i '' "s|^[[:space:]]*BUNDLE_ID_PREFIX.*|BUNDLE_ID_PREFIX = $BUNDLE_PREFIX|" "$CFG"
          else
            echo "BUNDLE_ID_PREFIX = $BUNDLE_PREFIX" >> "$CFG"
          fi
          xcodegen generate --quiet
          PROJ="$(ls -d *.xcodeproj | head -1)"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

          BUILD_NO="$(date -u +%Y%m%d%H%M)"
          echo "BUILD_NO=$BUILD_NO" >> "$GITHUB_ENV"
          for target in NOOPiOS NOOPiOSWidgets; do
            PLIST="$(xcodebuild -project "$PROJ" -target "$target" -showBuildSettings 2>/dev/null \
                     | awk -F' = ' '/^[[:space:]]*INFOPLIST_FILE = /{print $2; exit}')"
            if [ -n "$PLIST" ] && [ -f "$PLIST" ]; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NO" "$PLIST" 2>/dev/null \
                || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string $BUILD_NO" "$PLIST"
              if [ "$target" = "NOOPiOS" ]; then
                /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
                /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
              fi
              echo "Build $BUILD_NO -> $target ($PLIST)"
            else
              echo "::warning::Info.plist für $target nicht gefunden, nur Build-Setting gesetzt"
            fi
          done

      - name: Archivieren
        working-directory: src
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -quiet -project "$PROJ" -scheme NOOPiOS -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NOOP.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$BUILD_NO" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive

      - name: Zu TestFlight hochladen
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -quiet -exportArchive -archivePath "$RUNNER_TEMP/NOOP.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### $TAG (Build $BUILD_NO) zu TestFlight hochgeladen" >> "$GITHUB_STEP_SUMMARY"

      - name: Als gebaut markieren
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/built/$TAG" -f sha="$GITHUB_SHA" >/dev/null || echo "Merker-Tag existiert schon"
          gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/built-at/$BUILD_NO" -f sha="$GITHUB_SHA" >/dev/null

      - name: Aufräumen
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/keys"
